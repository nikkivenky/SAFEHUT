<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeHut - Interactive Shelter Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #1f2937;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .custom-popup .leaflet-popup-tip {
            background: white;
        }

        .header-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .header-overlay h1 {
            margin: 0;
            font-size: 18px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .badge {
            background: #10b981;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div class="header-overlay">
        <h1>SafeHut Shelter Finder</h1>
        <span class="badge">Verified Locations</span>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Initialize Map
        // Center: Semmencheri, Chennai (12.8723, 80.2251)
        var map = L.map('map', {
            zoomControl: false // Move zoom control to bottom right later
        }).setView([12.8723, 80.2251], 15);

        // OSM Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // Add Zoom Control to Bottom Right for cleaner look
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // Marker Data
        const locations = [
            { name: "St. Paul’s School", coords: [12.8709, 80.2239] },
            { name: "Professor S.A Government College", coords: [12.8736, 80.2264] },
            { name: "Semmencheri Government School", coords: [12.8761, 80.2279] },
            { name: "Shri Umadri Mahal", coords: [12.8698, 80.2281] }
        ];

        // Add Markers
        locations.forEach(loc => {
            L.marker(loc.coords)
                .addTo(map)
                .bindPopup(`<strong>${loc.name}</strong>`, {
                    className: 'custom-popup'
                });
        });

        // Ensure tiles load correctly on mount
        setTimeout(() => {
            map.invalidateSize();
        }, 100);
    </script>
</body>

</html>
